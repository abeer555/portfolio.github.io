<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRT Test - Firefox Debug</title>
    <style>
        :root {
            --bg: #06060e;
            --ink: #01020a;
            --green: #7cf5d3;
            --bw: 2px;
            --shadow: 6px 6px 0 var(--ink);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: white;
            font-family: monospace;
            padding: 40px;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 20px; color: var(--green); }
        .status { 
            background: #000; 
            padding: 20px; 
            margin-bottom: 30px;
            border: 2px solid var(--green);
        }
        
        /* CRT styles - copied from main site */
        .crt-wrap {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 6px;
            border: 3px dashed yellow; /* debug border */
        }
        .crt-body {
            width: 100%;
            min-width: 520px;
            background: #b3b1a5; /* fallback */
            background: linear-gradient(168deg, #d0cec4 0%, #b3b1a5 58%, #8f8d81 100%);
            border: var(--bw) solid var(--ink);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 18px 18px 14px;
        }
        .crt-screen {
            position: relative;
            border: 3px solid #3f3d35;
            border-radius: 14px / 18px;
            background: #0a0e0a; /* fallback */
            background: radial-gradient(130% 90% at 50% 42%, #171e17 0%, #0a0e0a 58%, #040604 100%);
            box-shadow:
                inset 0 0 2px rgba(0, 0, 0, 0.9),
                inset 0 0 26px rgba(0, 0, 0, 0.85),
                inset 0 2px 8px rgba(0, 0, 0, 0.75);
            overflow: hidden;
            cursor: pointer;
            display: block;
            min-height: 460px;
        }
        .crt-screen-inner {
            position: relative;
            z-index: 1;
            display: block;
            padding: 20px;
            color: var(--green);
            text-align: center;
        }
        .crt-chin {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 13px;
            padding: 9px 14px;
            background: linear-gradient(180deg, #c8c6ba, #a5a397);
            border: var(--bw) solid var(--ink);
            border-radius: 9px;
        }
        .brand {
            font-weight: 800;
            font-size: 0.7rem;
            letter-spacing: 2.5px;
            color: #4a483e;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Firefox CRT Rendering Test</h1>
        
        <div class="status">
            <p><strong>Browser:</strong> <span id="browser">Detecting...</span></p>
            <p><strong>CRT Visible:</strong> <span id="crt-status">Checking...</span></p>
            <p><strong>CRT Dimensions:</strong> <span id="crt-dims">Checking...</span></p>
        </div>

        <div class="crt-wrap" id="test-crt">
            <div class="crt-body">
                <div class="crt-screen">
                    <div class="crt-screen-inner">
                        <h2>ABEER·95</h2>
                        <p style="margin-top: 20px;">If you can see this text inside the dark screen,<br>the CRT is rendering!</p>
                    </div>
                </div>
                <div class="crt-chin">
                    <span class="brand">ABEER·95</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Detect browser
        const isFirefox = navigator.userAgent.toLowerCase().indexOf('firefox') > -1;
        document.getElementById('browser').textContent = isFirefox ? 'Firefox ✓' : navigator.userAgent.split(' ').pop();
        
        // Check CRT visibility
        window.addEventListener('load', () => {
            const crt = document.getElementById('test-crt');
            const rect = crt.getBoundingClientRect();
            const computed = window.getComputedStyle(crt);
            
            document.getElementById('crt-status').textContent = 
                rect.width > 0 && rect.height > 0 ? 'YES ✓' : 'NO ✗ (collapsed)';
            
            document.getElementById('crt-dims').textContent = 
                `${Math.round(rect.width)}px × ${Math.round(rect.height)}px (display: ${computed.display})`;
        });
    </script>
</body>
</html>
